<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento Barbearia</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Formulário p/ o cliente fazer o agendamento-->

    <form action>

        <h2>Agendar Atendimento</h2>

        <label for="Nome">Nome Completo:</label>
        <input type="text" name="Nome" id="Nome" placeholder="Nome completo" required>

        <label for="CPF">CPF:</label>
        <input type="number" name="CPF" id="CPF" placeholder="000.000.000-00" required>

        <label for="Endereço">Endereço:</label>
        <input type="text" name="Endereço" id="Endereço" placeholder="Endereço completo" required>

        <label for="Telefone">Telefone:</label>
        <input type="tel" name="Telefone" id="Telefone" placeholder="(00)00000-0000" required>

        <label for="Email">Email:</label>
        <input type="email" name="Email" id="Email" placeholder="seuemail@exemplo.com" required>

        <label for="Escolha o corte">Escolha o corte desejado:</label>
            <select id="corte" class="selection">
                <option value disabled selected hidden="Selecione">Selecione</option>
                <option value="Buzz cut">Buzz Cut</option>
                <option value="Fade/Degrade">Fade/Degradê</option>
                <option value="Mullet moderno">Mullet Moderno</option>
                <option value="Old money">Old Money</option>
            </select>
    
        
        <label for="Data">Data:</label>
            <input class="campo" type="date" id="Data" placeholder="dd/mm/aaaa" required>

        <label for="Horario">Horário</label>
            <input class="campo" type="time" id="Horário" placeholder="--:--" required>

        <button> Agendar </button>

    </form>

    <script src="AgendaBarbearia.js"></script>     <!-- Fazer o link com javascript -->
</body>

</html>
