<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento Barbearia</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Formulário p/ o cliente fazer o agendamento-->

    <form id="formulario">

        <h2>Agendar Atendimento</h2>

        <label for="Nome">Nome Completo:</label>
        <input type="text" name="Nome" id="Nome" placeholder="Nome completo" required>

        <label for="CPF">CPF:</label>
        <input type="number" name="CPF" id="CPF" placeholder="000.000.000-00">

        <label for="Endereço">Endereço:</label>
        <input type="text" name="Endereço" id="Endereço" placeholder="Endereço completo">

        <label for="Telefone">Telefone:</label>
        <input type="tel" name="Telefone" id="Telefone" placeholder="(00)00000-0000" required>

        <label for="Email">Email:</label>
        <input type="email" name="Email" id="Email" placeholder="seuemail@exemplo.com" required>

        <label for="corte">Escolha o corte desejado:</label>
            <select id="corte" class="selection">
                <option value="" disabled selected hidden>Selecione</option>
                <option value="Buzz cut">Buzz Cut</option>
                <option value="Fade/Degrade">Fade/Degradê</option>
                <option value="Mullet moderno">Mullet Moderno</option>
                <option value="Old money">Old Money</option>
            </select>
    
        
        <label for="Data">Data:</label>
            <input class="campo" type="date" id="Data" placeholder="dd/mm/aaaa" required>

        <label for="Horario">Horário</label>
            <input class="campo" type="time" id="Horario" placeholder="--:--" required>

        <button type="submit"> Agendar </button>

    </form>

     <!-- Tabela para controle de agenda da barbearia gerada de acordo com os dados inseridos no formulário -->

    <h2>Controle de Agenda - Barbearia</h2>
    <table id="tabela">
        <thead>
        <tr>
            <th>Nome</th>
            <th>Telefone</th>
            <th>Email</th>
            <th>Corte Desejado</th>
            <th>Data</th>
            <th>Horário</th>
        </tr>
        </thead>
        <tbody>
            <!-- Outras linhas vão entrar aqui-->
             
        </tbody>
    </table>

    <script src="AgendaBarbearia.js"></script>     <!-- Fazer o link com javascript -->

</body>

</html>
